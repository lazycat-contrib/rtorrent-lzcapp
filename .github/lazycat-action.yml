version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/rtorrent.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: rutorrent
    bump: patch
build:
  run_buildscript: false
images:
  # 上游 linuxserver/rutorrent 无三段 SemVer 家族（纯数字为历史版本、sha8-lsN/vX.Y-lsN 为构建号）→ latest 唯一可跟踪 tag，digest-pin（amd64 platform digest）+ patch 自增
  - id: rutorrent
    target: service
    service: rutorrent
    source: linuxserver/rutorrent
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: RTorrent
    summary: "一个 BitTorrent 客户端"
